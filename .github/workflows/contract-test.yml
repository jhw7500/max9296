name: Contract Tests

on:
  push:
    branches: [main, master]
    paths:
      - '**.c'
      - '**.h'
      - 'tests/**'
      - '.github/workflows/contract-test.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.c'
      - '**.h'
      - 'tests/**'
      - '.github/workflows/contract-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Repository Health Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run health contracts
        run: bash tests/run_health_tests.sh
