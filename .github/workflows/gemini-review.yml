name: Gemini Review

on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        description: Pull request number
        required: true
      issue_title:
        type: string
        description: Pull request title
        required: true
      issue_body:
        type: string
        description: Pull request body
        required: true
      additional_context:
        type: string
        description: Any additional context from the request
        required: false

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: gemini-review

  review:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-review.yml@v1.23
    with:
      pr_number: ${{ inputs.pr_number }}
      issue_title: ${{ inputs.issue_title }}
      issue_body: ${{ inputs.issue_body }}
      additional_context: ${{ inputs.additional_context }}
    secrets: inherit
