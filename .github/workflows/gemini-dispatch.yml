name: Gemini Dispatch

on:
  pull_request_review_comment:
    types:
      - created
  pull_request_review:
    types:
      - submitted
  pull_request:
    types:
      - opened
  issues:
    types:
      - opened
      - reopened
  issue_comment:
    types:
      - created

defaults:
  run:
    shell: bash

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: gemini-dispatch

  dispatch:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    uses: jhw7500/automation/.github/workflows/gemini-dispatch.yml@v1.23
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    secrets: inherit
