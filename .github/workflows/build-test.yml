name: Build and Test

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build-test.yml'
      - '.github/workflow-config.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/build-test.yml'
      - '.github/workflow-config.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled in config'
        type: boolean
        default: false

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: build-test
          force-run: ${{ github.event.inputs.force_run || 'false' }}

  build:
    name: Build Kernel Module
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Setup environment
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kernel headers and build tools
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            linux-headers-5.10.0-generic \
            kmod

      - name: Build kernel module
        run: |
          # Use Linux 5.10 kernel headers for build
          export KERNEL_SRC=/usr/src/linux-headers-5.10.0-generic
          make KERNEL_SRC=$KERNEL_SRC

      - name: Verify build artifacts
        run: |
          # Check if kernel module was created
          if [ ! -f max9296.ko ]; then
            echo "Error: max9296.ko not found"
            exit 1
          fi

          echo "Kernel module built successfully!"
          ls -lh max9296.ko

      - name: Check module info
        run: |
          # Display module information
          echo "### Module Information"
          modinfo max9296.ko || true

          # Check for basic module sections
          echo ""
          echo "### Module Sections"
          readelf -S max9296.ko | grep -E "\.text|\.data|\.bss|\.modinfo" || true

      - name: Verify module symbols
        run: |
          # Check for expected symbols
          echo "### Checking module symbols..."
          nm max9296.ko | grep -E "(init_module|cleanup_module)" || echo "Warning: Standard module symbols not found"

      - name: Static analysis
        run: |
          # Run sparse if available (kernel static analysis)
          echo "### Static Analysis"
          if command -v sparse &> /dev/null; then
            make C=1 KERNEL_SRC=/lib/modules/$(uname -r)/build || echo "Sparse analysis completed with warnings"
          else
            echo "Sparse not available, skipping static analysis"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: max9296-module
          path: |
            max9296.ko
            Module.symvers
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f max9296.ko ]; then
            echo "✅ Kernel module built successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Module Info" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            modinfo max9296.ko 2>/dev/null || echo "Module info not available" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### File Size" >> $GITHUB_STEP_SUMMARY
            ls -lh max9296.ko >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Kernel module build failed" >> $GITHUB_STEP_SUMMARY
          fi

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::Build and Test workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Build and Test is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
